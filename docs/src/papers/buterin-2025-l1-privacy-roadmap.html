                <a itemprop="url" rel='nofollow' href='https://ethereum-magicians.org/u/mpeyfuss'><span itemprop='name'>mpeyfuss</span></a>

              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-04-11T13:28:26Z' class='post-time'>
                    April 11, 2025,  1:28pm
                  </time>
                  <meta itemprop='dateModified' content='2025-04-11T13:28:26Z'>
              <span itemprop='position'>18</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>This is interesting. Two questions come to mind, from an app developer perspective.</p>
<p>First, having per-app wallets seems to go against the thinking that I can use my wallet across all different applications. Funding those new wallets brings user friction as well. We’ve seen that any additional steps already represent a drop off in user engagement.</p>
<p>Second, what impact would this have on regulation of ETH? I know governments don’t want financial activity hidden from them. Does this pose a threat to users and apps building on Ethereum?</p>
<p>I’m not an expert in privacy so really just asking questions. Cheers!</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="0" />
              <span class='post-likes'></span>
            </div>



          </div>
          <div id='post_19' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://ethereum-magicians.org/u/teddy'><span itemprop='name'>teddy</span></a>

              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-04-11T14:00:30Z' class='post-time'>
                    April 11, 2025,  2:00pm
                  </time>
                  <meta itemprop='dateModified' content='2025-04-11T14:00:30Z'>
              <span itemprop='position'>19</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>On RPC Privacy specifically:</p>
<p>Why choose to move in the direction of TEE-&gt;PIR-&gt;mixnet instead of focusing on making every wallet be able to run the relevant parts of a node (aka <em>light client</em>?) I feel like going for the former means aiming for an Ethereum ecosystem with privacy guarantees resembling tradfi, while moving in the direction of light clients could yield actually better privacy long-term.</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="1" />
              <span class='post-likes'>1 Like</span>
            </div>



          </div>
          <div id='post_20' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://ethereum-magicians.org/u/h4x3rotab'><span itemprop='name'>h4x3rotab</span></a>

              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-04-11T17:41:12Z' class='post-time'>
                    April 11, 2025,  5:41pm
                  </time>
                  <meta itemprop='dateModified' content='2025-04-11T17:41:12Z'>
              <span itemprop='position'>20</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>I can see a lot of space to explore when using TEE. For example:</p>
<ol>
<li><strong>Self hosted light client in TEE</strong>. We get a solution that doesn’t rely on any single point of failure, but still can outsource the tedious maintenance tasks to some other providers. We can plug it into almost all the wallets or dapp frontend from the day one. There are people exploring running Helios in TEE [2] to achieve this.</li>
<li><strong>Mixnet in TEE</strong>. There are also some exploration to run a Tor node in TEE [1]. Since the light client also relies on an upstream RPC provider, it would be a nice addon to redirect all the traffic through a mixnet like Tor to hide the IP address and traffic features.</li>
</ol>
<p>Links:</p>
<ol>
<li>/github.com/Dstack-TEE/dstack-examples/tree/main/tor-hidden-service</li>
<li>/github.com/Dstack-TEE/dstack-examples/tree/main/lightclient</li>
</ol>
<p>(The forum dislike me to post link directly)</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="1" />
              <span class='post-likes'>1 Like</span>
            </div>



          </div>
          <div id='post_21' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://ethereum-magicians.org/u/SCBuergel'><span itemprop='name'>SCBuergel</span></a>

              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-04-11T21:51:47Z' class='post-time'>
                    April 11, 2025,  9:51pm
                  </time>
                  <meta itemprop='dateModified' content='2025-04-11T21:51:47Z'>
              <span itemprop='position'>21</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>This list is good but IMO too narrowly RPC-focused when thinking about data-harvesting third party services. That is ok for a typical Ethereum wallet of 2018, but (sadly!) not anymore. Unfortunately, a contemporary Ethereum wallet pings a prospering jungle of centralized servers and services for:</p>
<ul>
<li>gas prices</li>
<li>price feeds</li>
<li>tx simulation</li>
<li>scam checkers</li>
<li>gas-less transactions</li>
<li>cross-chain balances</li>
<li>multisigs with off-chain signature services</li>
<li>a range of indexer data, typically for token balances</li>
<li>token icons (<a href="https://x.com/SCBuergel/status/1798031499318706484" rel="noopener nofollow ugc">here’s a fun demo showing why this is much more evil than you think!</a>)</li>
</ul>
<p>All of them reveal some level of personal data. Minimally that is “IP 1.2.3.4 is doing something with Ethereum right now” but usually it is much more and much more personal. So I’d say that we need a general purpose anonymous transport layer, beyond just anonymizing simple RPC calls.</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>

              <span class='post-likes'>5 Likes</span>
            </div>



          </div>
          <div id='post_22' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://ethereum-magicians.org/u/peersky'><span itemprop='name'>peersky</span></a>

              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-04-13T05:49:58Z' class='post-time'>
                    April 13, 2025,  5:49am
                  </time>
                  <meta itemprop='dateModified' content='2025-04-13T05:49:58Z'>
              <span itemprop='position'>22</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Instead of submitting as “<em>pinnaple-green-swordwish</em>” many “normal” users want to have notifications in form “<em>Tim</em> submitted his proposal” (for those who has been granted notion about account connection to the sender identity) but keep the submission private.</p>
<p>Especially in case of on-chain governance this allows better level of UX and reducing <a href="https://en.wikipedia.org/wiki/Halo_effect" rel="noopener nofollow ugc">halo</a>.</p>
<p>This  requires reveal only commit and have 3rd party to host pool of proposals that later is batch revealed, ongoing UX goals for <a href="https://rankify.it" rel="noopener nofollow ugc">Rankify.it</a> / <a href="https://peeramid.network" rel="noopener nofollow ugc">Peeramid.network</a>  looks like this:</p>
<pre><code class="lang-auto">Bot: @Bob sent a proposal. // public commitment &amp; signed by Bob and trusted server holding nullifier
Bot: @Alice sent a proposal.
Bot: @Georg hurry up!
Bot: @Georg sent a proposal.
Bot: New proposals: A;B;C; // Server reveals &amp; nullifies pool of proposals
// Voting phase begins &lt;..&gt;
// Tally, posts proofs of data integrity
Bot: Winning proposal was C, it was sent by @Bob

</code></pre>
<p>Current plans is to have marketplace for such private pools, enabling users to pick whatever trust guarantees they want (chose between Lit, ICP, TEE, Self hosted MPC etc).</p>
<p><a class="mention" href="/u/vbuterin">@vbuterin</a> Im having hard time to classify that though, does that fit in your categorization under privacy pools  or aggregation?</p>
            </div>
