        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_23459&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:57010,\&quot;name\&quot;:\&quot;Vbuterin\&quot;,\&quot;username\&quot;:\&quot;vbuterin\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/vbuterin/{size}/1209_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T01:29:18.272Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003cem\\u003eSee also: pcaversaccio’s roadmap: \\u003ca href=\\\&quot;https://ethresear.ch/t/ethereum-privacy-the-road-to-self-sovereignty/22115\\\&quot; class=\\\&quot;inline-onebox\\\&quot;\\u003eEthereum Privacy: The Road to Self-Sovereignty - Privacy - Ethereum Research\\u003c/a\\u003e\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThese are my current thoughts on how we can practically improve the state of privacy experienced by Ethereum’s users in a way that is very light on Ethereum consensus changes. This covers four primary key forms of privacy:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003ePrivacy of onchain payments\\u003c/li\\u003e\\n\\u003cli\\u003ePartial anonymization of onchain activity inside applications\\u003c/li\\u003e\\n\\u003cli\\u003ePrivacy of reads to the chain, ie. RPC calls\\u003c/li\\u003e\\n\\u003cli\\u003eNetwork-level anonymization\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eThis roadmap can be combined with a longer-term roadmap that makes deeper changes to L1, or privacy-preserving application-specific rollups, or other more complex features.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-57010-roadmap-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-57010-roadmap-1\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003eRoadmap\\u003c/h2\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eIncorporate privacy tools (eg. \\u003ca href=\\\&quot;https://www.railway.xyz/\\\&quot;\\u003eRailgun\\u003c/a\\u003e, \\u003ca href=\\\&quot;https://privacypools.com/\\\&quot;\\u003ePrivacy Pools\\u003c/a\\u003e) into existing wallets\\u003c/strong\\u003e. Wallets should have a notion of a shielded balance, and when you send to someone else, there should be a “send from shielded balance” option, ideally turned on by default. This should all be designed to feel maximally natural from a UX perspective. Users should NOT have to download a separate “privacy wallet”\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eMove the ecosystem toward “one address per application” by default\\u003c/strong\\u003e. This is a major step, and it entails significant convenience sacrifices, but IMO this is a bullet that we should bite, because this is the most practical way to remove public links between all of your activity across different applications. Moving toward such a design also works very naturally with in-application wallets, and the new workflows required to make this work look very similar to what is needed already with cross-chain interoperability (eg. depositing funds to a chain from one of multiple sources)\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eMake send-to-self privacy-preserving by default\\u003c/strong\\u003e - needed to make (2) work\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eImplement \\u003ca href=\\\&quot;https://ethresear.ch/t/fork-choice-enforced-inclusion-lists-focil-a-simple-committee-based-inclusion-list-proposal/19870\\\&quot;\\u003eFOCIL\\u003c/a\\u003e and \\u003ca href=\\\&quot;https://eips.ethereum.org/EIPS/eip-7701\\\&quot;\\u003eEIP-7701\\u003c/a\\u003e\\u003c/strong\\u003e, and make sure to implement a version of FOCIL that is EIP-7701-friendly. Along with EIP 7701’s account abstraction benefits, this allows protocols like PP, Railway, Tornado etc to operate without needing relays / public broadcasters, greatly simplifying the development and maintenance of such protocols. FOCIL greatly improves censorship resistance of all transactions, including privacy-preserving transactions.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eIncorporate TEE-based RPC privacy into existing wallets, as a short-term mitigation\\u003c/strong\\u003e. \\u003ca href=\\\&quot;https://www.1rpc.io/ecosystem/automata\\\&quot;\\u003eAutomata\\u003c/a\\u003e has a version of this already; this needs to be verified and hardened as much as possible. This allows users to interact with RPC nodes while getting stronger assurances that their private data is not being collected.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eReplace TEEs with private information retrieval (PIR) once the tech becomes ready\\u003c/strong\\u003e. PIR offers cryptographic guarantees, and so is much stronger than TEEs, but it is currently not efficient enough for large datasets. Potentially we can consider hybrid approaches, eg. use TEEs to isolate regions of the state of size 2**20, and use PIR inside of those, shifting the constants up over time as PIR becomes more efficient.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eWallets should connect to multiple RPC nodes, optionally through a mixnet, ideally use a different RPC node per dapp\\u003c/strong\\u003e. If we also add security armoring to RPC nodes (ie. light client support), it becomes practical for a user to trust a much larger set of RPC servers. This reduces metadata leakage.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eWork on proof aggregation protocols\\u003c/strong\\u003e to allow multiple privacy-protocol transactions to share a single onchain proof. This greatly reduces the gas costs of privacy protocols.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eWork on privacy-preserving keystore wallets\\u003c/strong\\u003e (see more detailed explanations \\u003ca href=\\\&quot;https://vitalik.eth.limo/general/2023/06/09/three_transitions.html\\\&quot;\\u003ein this post\\u003c/a\\u003e). This allows users to upgrade their account verification logic (algorithm or keys) in one transaction, and have this change be immediately reflected in all private notes that they control (across L1 and all L2s!), without publicly linking those notes.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eAt the end of this, we will have a world where:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eA large portion of sends are private, and private sends are default in many cases\\u003c/li\\u003e\\n\\u003cli\\u003eActivity inside of each individual application is public, but the link between your activity in application A and your activity in application B is private\\u003c/li\\u003e\\n\\u003cli\\u003ePrivacy guarantees hold not just against adversaries passively observing the chain, but also adversaries operating RPC nodes\\u003c/li\\u003e\\n\\u003c/ul\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T01:40:19.405Z\&quot;,\&quot;reply_count\&quot;:5,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:11434,\&quot;reads\&quot;:257,\&quot;readers_count\&quot;:256,\&quot;score\&quot;:57676.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Vbuterin\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:3,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://ethresear.ch/t/ethereum-privacy-the-road-to-self-sovereignty/22115\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\& ;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/5\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57021,\&quot;name\&quot;:\&quot;Nelson\&quot;,\&quot;username\&quot;:\&quot;NelsonMcKey\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/nelsonmckey/{size}/7937_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T03:13:26.164Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cblockquote\\u003e\\n\\u003cp\\u003eAlong with EIP 7701’s account abstraction benefits, this allows protocols like PP, Railway, Tornado etc to operate without needing relays / public broadcasters…\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eSee point four.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:6,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T03:13:26.164Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:3,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:9,\&quot;reads\&quot;:145,\&quot;readers_count\&quot;:144,\&quot;score\&quot;:73.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Nelson\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:13293,\&quot;username\&quot;:\&quot;privacycaviar\&quot;,\&quot;name\&quot;:\&quot;privacyking\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/p/d26b3c/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:6911,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/6\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57026,\&quot;name\&quot;:\&quot;Tim Daubenschütz\&quot;,\&quot;username\&quot;:\&quot;TimDaub\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/timdaub/{size}/5038_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T05:35:47.136Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;vbuterin\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;23459\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e vbuterin:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eMove the ecosystem toward “one address per application” by default\\u003c/strong\\u003e. This is a major step, and it entails significant convenience sacrifices, but IMO this is a bullet that we should bite, because this is the most practical way to remove public links between all of your activity across different applications. Moving toward such a design also works very naturally with in-application wallets, and the new workflows required to make this work look very similar to what is needed already with cross-chain interoperability (eg. depositing funds to a chain from one of multiple sources)\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eWhat does this mean for ENS usage? My understanding is that most users currently have one intentionally publicly known address that they use to onboard to apps. And then they have other wallets where they store their wealth, trade, etc. Is an „application“ here: wealth store, trading, public theatre, or is an application: Uniswap, Aave?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T05:38:09.930Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:30,\&quot;reads\&quot;:140,\&quot;readers_count\&quot;:139,\&quot;score\&quot;:187.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Tim Daubenschütz\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:879,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/7\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57028,\&quot;name\&quot;:\&quot;Vbuterin\&quot;,\&quot;username\&quot;:\&quot;vbuterin\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/vbuterin/{size}/1209_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T06:43:16.653Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eTwo possible answers:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eYou can have a single address that is your ENS address, but that’s not the address you use for apps by default.\\u003c/li\\u003e\\n\\u003cli\\u003eStealth addresses (so, others can use your ENS data to send things to a fresh address that you control, without others being able to publicly link it)\\u003c/li\\u003e\\n\\u003c/ol\\u003e\&quot;,\&quot;post_number\&quot;:8,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T06:43:16.653Z\&quot;,\&quot;reply_count\&quot;:3,\&quot;reply_to_post_number\&quot;:7,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:24,\&quot;reads\&quot;:128,\&quot;readers_count\&quot;:127,\&quot;score\&quot;:280.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Vbuterin\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:879,\&quot;username\&quot;:\&quot;TimDaub\&quot;,\&quot;name\&quot;:\&quot;Tim Daubenschütz\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/timdaub/{size}/5038_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:8}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1101,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/8\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57038,\&quot;name\&quot;:\&quot;Mac Budkowski\&quot;,\&quot;username\&quot;:\&quot;MacBudkowski\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/macbudkowski/{size}/14605_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T07:48:33.131Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cblockquote\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eYou can have a single address that is your ENS address, but that’s not the address you use for apps by default.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eOkay, so if we follow this path, I think we have to think about UX. E.g., we could ask users before connecting to each app if they want to make their actions public.\\u003c/p\\u003e\\n\\u003cp\\u003eAnd also educate them that if they make their actions public, they can build their onchain reputation. So it’s like “sending a DM on Signal” vs. “sending a tweet\\\&quot;. One is better for privacy, one is better for building reputation.\\u003c/p\\u003e\\n\\u003cp\\u003eIf we don’t do it, we will slow down onchain identity by a lot. And this is a thing that differentiates blockchain addresses from e-mails.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you run web2 social (like Reddit), users send their gmail addresses to create an account. As a company you have to accept all of them because you cannot check if one address is more legit than the other. It makes it pretty easy to astroturf and run bot networks.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you run onchain social, you can take users’ wallets and check some predefined parameters. E.g., how old is the address, how many txs it did, what are relationship with other potentially problematic addresses and so on. We already been doing that at Kiwi and it’s been very helpful to track these behaviors.\\u003c/p\\u003e\\n\\u003cp\\u003eOn Farcaster, where every action is public by default (and wouldn’t be impacted since they use their own P2P network), you can even create these forensics graphs \\u003ca href=\\\&quot;https://warpcast.com/geoffgolberg/0xee3cbbea\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003elike this one.\\u003c/a\\u003e And of course everyone can do them, which is a big plus.\\u003c/p\\u003e\\n\\u003cp\\u003eIf - on the other hand - everyone was doing 100% private onchain actions, it’d cripple onchain social defensive capabilities.\\u003c/p\\u003e\\n\\u003cp\\u003ePS: We already see onchain identity fragmentation because of in-app wallets, as \\u003ca href=\\\&quot;https://x.com/MacBudkowski/status/1863951819296153623\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eI described here\\u003c/a\\u003e and lately also noted by \\u003ca href=\\\&quot;https://warpcast.com/nonlinear.eth/0x7763a1e8\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003enonlinear\\u003c/a\\u003e.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:9,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T09:29:36.547Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:8,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:50,\&quot;reads\&quot;:125,\&quot;readers_count\&quot;:124,\&quot;score\&quot;:304.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Mac Budkowski\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://warpcast.com/geoffgolberg/0xee3cbbea\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Warpcast\&quot;,\&quot;clicks\&quot;:13},{\&quot;url\&quot;:\&quot;https://x.com/MacBudkowski/status/1863951819296153623\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:11},{\&quot;url\&quot;:\&quot;https://warpcast.com/nonlinear.eth/0x7763a1e8\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Warpcast\&quot;,\&quot;clicks\&quot;:7}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1101,\&quot;username\&quot;:\&quot;vbuterin\&quot;,\&quot;name\&quot;:\&quot;Vbuterin\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/vbuterin/{size}/1209_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:13183,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/9\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57063,\&quot;name\&quot;:\&quot;Kyle Den Hartog\&quot;,\&quot;username\&quot;:\&quot;kdenhartog\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/kdenhartog/{size}/7035_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T08:52:52.959Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eNumber 2 is effectively just recreating 3P cookies if we don’t do it. Web2 has already shown this isn’t a good path forward with everyone except Google having disabled them by default:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;onebox allowlistedgeneric\\\&quot; data-onebox-src=\\\&quot;https://kyledenhartog.com/recreating-web3-cross-origin-tracking/\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot;\\u003e\\n      \\u003cimg src=\\\&quot;https://kyledenhartog.com/favicon.png\\\&quot; class=\\\&quot;site-icon\\\&quot; width=\\\&quot;32\\\&quot; height=\\\&quot;32\\\&quot;\\u003e\\n\\n      \\u003ca href=\\\&quot;https://kyledenhartog.com/recreating-web3-cross-origin-tracking/\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eKyle Den Hartog\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003cimg width=\\\&quot;500\\\&quot; height=\\\&quot;500\\\&quot; src=\\\&quot;https://kyledenhartog.com/assets/img/profile.jpg\\\&quot; class=\\\&quot;thumbnail onebox-avatar\\\&quot;\\u003e\\n\\n\\u003ch3\\u003e\\u003ca href=\\\&quot;https://kyledenhartog.com/recreating-web3-cross-origin-tracking/\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eWeb3 is Reintroducing Cross-Origin Tracking Accidentally\\u003c/a\\u003e\\u003c/h3\\u003e\\n\\n  \\u003cp\\u003eWe should expect that when the user shares their address that will act as implied consent for cross-origin tracking in the same way cookie notices act as a prompt for tracking.\\u003c/p\\u003e\\n\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eAs for number 7, \\u003ca href=\\\&quot;https://datatracker.ietf.org/doc/rfc9458/\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eOblivious HTTPS\\u003c/a\\u003e is another alternative solution so that we don’t face latency tradeoffs. We need RPC services to enable support for it though.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:10,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T08:55:41.808Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:45,\&quot;reads\&quot;:106,\&quot;readers_count\&quot;:105,\&quot;score\&quot;:261.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Kyle Den Hartog\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://kyledenhartog.com/recreating-web3-cross-origin-tracking/\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Web3 is Reintroducing Cross-Origin Tracking Accidentally – Kyle Den Hartog\&quot;,\&quot;clicks\&quot;:23},{\&quot;url\&quot;:\&quot;https://datatracker.ietf.org/doc/rfc9458/\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;RFC 9458 - Oblivious HTTP\&quot;,\&quot;clicks\&quot;:13}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:6119,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/10\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57064,\&quot;name\&quot;:\&quot;Kyle Den Hartog\&quot;,\&quot;username\&quot;:\&quot;kdenhartog\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/kdenhartog/{size}/7035_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T09:03:29.846Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eOption 1 faces the tradeoff that onchain transactions still leak data. This works IfF we also get 1 by default.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:11,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T09:03:29.846Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:8,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:9,\&quot;reads\&quot;:101,\&quot;readers_count\&quot;:100,\&quot;score\&quot;:65.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Kyle Den Hartog\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1101,\&quot;username\&quot;:\&quot;vbuterin\&quot;,\&quot;name\&quot;:\&quot;Vbuterin\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/vbuterin/{size}/1209_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:6119,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/11\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57081,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;Styliann\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/styliann/{size}/12127_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T12:14:53.268Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThis is a roadmap for Privacy in the traditional sense - i.e. Anonymity.\\u003c/p\\u003e\\n\\u003cp\\u003eHow about encrypting balances and amounts, with the ability to selectively reveal them to a third party? Any thoughts on the confidential ERC20 standard?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:15,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T12:14:53.268Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:7,\&quot;reads\&quot;:93,\&quot;readers_count\&quot;:92,\&quot;score\&quot;:68.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:8725,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:0,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/15\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57091,\&quot;name\&quot;:\&quot;Michael Connor\&quot;,\&quot;username\&quot;:\&quot;iAmMichaelConnor\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/iammichaelconnor/{size}/2952_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T12:37:02.685Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI’m helping design the Aztec privacy rollup, so this is right up my street. We want to make sure we keep pace with Ethereum’s privacy needs. I have some questions / comments.\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;vbuterin\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;23459\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e vbuterin:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eThis allows users to upgrade their account verification logic (algorithm or keys) in one transaction, and have this change be immediately reflected in all private notes that they control (across L1 and all L2s!), without publicly linking those notes\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eA nullifier keypair for a note can’t easily be rotated, because (a) the nullifier for a given note is deterministically* derived from the secret key of the nullifier public key that “owns” the note, and (b) rotation can lead to double-spend bugs.\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e(a) A nullifier is usually something like \\u003ccode\\u003ehash(hash(note), nullifier_secret_key_1)\\u003c/code\\u003e. If you rotate your nullifier keypair, the nullifier for this note still relies on the old nullifier keypair.\\u003c/li\\u003e\\n\\u003cli\\u003e(b) You \\u003cem\\u003ecould\\u003c/em\\u003e detach the “owner” of the note from the nullifier keypair, by storing the nullifier public key against the “owner” in a keystore registry. The owner could then rotate their nullifier public key  in the registry. But there’s then a risk that the “owner” can spend the note twice: once by deriving a nullifier from the first nullifier secret key; and a second time by rotating their nullifier public key and deriving second nullifier from the second nullifier secret key.\\u003cbr\\u003e\\n* There’s a way to solve this, but it’s constraint-heavy, and requires proving: when the rotation took place; when the note was created; and that the ‘old’ nullifier hasn’t already been used.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;vbuterin\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;23459\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e vbuterin:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eMove the ecosystem toward “one address per application” by default\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eAren’t there examples of complex defi flows (which compose many smart contract function calls together) which would \\u003cem\\u003erequire\\u003c/em\\u003e the user’s address to be \\u003cem\\u003ethe same\\u003c/em\\u003e across all the different smart contracts?\\u003cbr\\u003e\\nEven a simple lending contract stores information against a borrower’s address, but also calls separate token contracts to decrement/increment balances of that \\u003cem\\u003esame borrower’s address\\u003c/em\\u003e.\\u003cbr\\u003e\\nConsider more crazy complex flows like: take a flash loan; use the borrowed asset to provide liquidity elsewhere; use the LP tokens and stake them somewhere else; use those staked LP tokens as collateral on another protocol to mint a stablecoin; swap the stablecoin for another asset; repay the flash loan.\\u003cbr\\u003e\\n… For that crazy flow, isn’t it beneficial for the user’s address to be the same across all those smart contracts?\\u003cbr\\u003e\\nWould it be more fitting to encourage one address per “defi session” (whatever that might be)?\\u003cbr\\u003e\\nWe’re debating this topic at Aztec, currently.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;vbuterin\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;23459\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e vbuterin:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eUsers should NOT have to download a separate “privacy wallet”\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eWould it be acceptable if these wallets have to generate and track a new set of secrets, as most privacy tools use snark-friendly secrets that are different from a user’s Ethereum private key?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;vbuterin\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;23459\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e vbuterin:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003ethis allows protocols like PP, Railway, Tornado etc to operate without needing relays / public broadcasters\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eHow does this work? How do the gas fees get paid?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ol\\u003e\&quot;,\&quot;post_number\&quot;:16,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T12:45:18.860Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:16,\&quot;reads\&quot;:97,\&quot;readers_count\&quot;:96,\&quot;score\&quot;:129.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Michael Connor\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:3,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:2163,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/16\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57092,\&quot;name\&quot;:\&quot;jimjim.eth\&quot;,\&quot;username\&quot;:\&quot;jimjim.eth\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/jimjim.eth/{size}/14813_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T12:41:41.569Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;vbuterin\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;23459\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e vbuterin:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e“one address per application”\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eWhy cant we just atomically unshield and unshield like how railgun does it with their 0x integration? It would be far more private! It would also be the same UX flow for more endgame privacy like in aztec.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:17,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T12:41:41.569Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:8,\&quot;reads\&quot;:84,\&quot;readers_count\&quot;:83,\&quot;score\&quot;:86.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;jimjim.eth\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:13311,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:0,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/17\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57093,\&quot;name\&quot;:\&quot;Marco\&quot;,\&quot;username\&quot;:\&quot;mpeyfuss\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/mpeyfuss/{size}/7495_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T13:28:26.411Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThis is interesting. Two questions come to mind, from an app developer perspective.\\u003c/p\\u003e\\n\\u003cp\\u003eFirst, having per-app wallets seems to go against the thinking that I can use my wallet across all different applications. Funding those new wallets brings user friction as well. We’ve seen that any additional steps already represent a drop off in user engagement.\\u003c/p\\u003e\\n\\u003cp\\u003eSecond, what impact would this have on regulation of ETH? I know governments don’t want financial activity hidden from them. Does this pose a threat to users and apps building on Ethereum?\\u003c/p\\u003e\\n\\u003cp\\u003eI’m not an expert in privacy so really just asking questions. Cheers!\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:18,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T13:28:26.411Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:6,\&quot;reads\&quot;:81,\&quot;readers_count\&quot;:80,\&quot;score\&quot;:46.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Marco\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:6541,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/18\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57099,\&quot;name\&quot;:\&quot;teddy\&quot;,\&quot;username\&quot;:\&quot;teddy\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/teddy/{size}/14524_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T14:00:30.133Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eOn RPC Privacy specifically:\\u003c/p\\u003e\\n\\u003cp\\u003eWhy choose to move in the direction of TEE-\\u0026gt;PIR-\\u0026gt;mixnet instead of focusing on making every wallet be able to run the relevant parts of a node (aka \\u003cem\\u003elight client\\u003c/em\\u003e?) I feel like going for the former means aiming for an Ethereum ecosystem with privacy guarantees resembling tradfi, while moving in the direction of light clients could yield actually better privacy long-term.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:19,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T14:00:30.133Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:15,\&quot;reads\&quot;:77,\&quot;readers_count\&quot;:76,\&quot;score\&quot;:105.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;teddy\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:13102,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/19\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57109,\&quot;name\&quot;:\&quot;Hang Yin\&quot;,\&quot;username\&quot;:\&quot;h4x3rotab\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/h4x3rotab/{size}/14822_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T17:41:12.778Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI can see a lot of space to explore when using TEE. For example:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eSelf hosted light client in TEE\\u003c/strong\\u003e. We get a solution that doesn’t rely on any single point of failure, but still can outsource the tedious maintenance tasks to some other providers. We can plug it into almost all the wallets or dapp frontend from the day one. There are people exploring running Helios in TEE [2] to achieve this.\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eMixnet in TEE\\u003c/strong\\u003e. There are also some exploration to run a Tor node in TEE [1]. Since the light client also relies on an upstream RPC provider, it would be a nice addon to redirect all the traffic through a mixnet like Tor to hide the IP address and traffic features.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eLinks:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e/github.com/Dstack-TEE/dstack-examples/tree/main/tor-hidden-service\\u003c/li\\u003e\\n\\u003cli\\u003e/github.com/Dstack-TEE/dstack-examples/tree/main/lightclient\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003e(The forum dislike me to post link directly)\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:20,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T17:41:12.778Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:10,\&quot;reads\&quot;:79,\&quot;readers_count\&quot;:78,\&quot;score\&quot;:80.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Hang Yin\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:13317,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:0,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/20\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57115,\&quot;name\&quot;:\&quot;Sebastian Bürgel\&quot;,\&quot;username\&quot;:\&quot;SCBuergel\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/scbuergel/{size}/14825_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-11T21:51:47.165Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThis list is good but IMO too narrowly RPC-focused when thinking about data-harvesting third party services. That is ok for a typical Ethereum wallet of 2018, but (sadly!) not anymore. Unfortunately, a contemporary Ethereum wallet pings a prospering jungle of centralized servers and services for:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003egas prices\\u003c/li\\u003e\\n\\u003cli\\u003eprice feeds\\u003c/li\\u003e\\n\\u003cli\\u003etx simulation\\u003c/li\\u003e\\n\\u003cli\\u003escam checkers\\u003c/li\\u003e\\n\\u003cli\\u003egas-less transactions\\u003c/li\\u003e\\n\\u003cli\\u003ecross-chain balances\\u003c/li\\u003e\\n\\u003cli\\u003emultisigs with off-chain signature services\\u003c/li\\u003e\\n\\u003cli\\u003ea range of indexer data, typically for token balances\\u003c/li\\u003e\\n\\u003cli\\u003etoken icons (\\u003ca href=\\\&quot;https://x.com/SCBuergel/status/1798031499318706484\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ehere’s a fun demo showing why this is much more evil than you think!\\u003c/a\\u003e)\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eAll of them reveal some level of personal data. Minimally that is “IP 1.2.3.4 is doing something with Ethereum right now” but usually it is much more and much more personal. So I’d say that we need a general purpose anonymous transport layer, beyond just anonymizing simple RPC calls.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:21,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:39,\&quot;updated_at\&quot;:\&quot;2025-04-11T21:51:47.165Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:20,\&quot;reads\&quot;:81,\&quot;readers_count\&quot;:80,\&quot;score\&quot;:191.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:23459,\&quot;topic_slug\&quot;:\&quot;a-maximally-simple-l1-privacy-roadmap\&quot;,\&quot;display_username\&quot;:\&quot;Sebastian Bürgel\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://x.com/SCBuergel/status/1798031499318706484\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:11}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:5}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1671,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/a-maximally-simple-l1-privacy-roadmap/23459/21\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:57153,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;peersky\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/ethereum-magicians.org/peersky/{size}/6246_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-04-13T05:49:58.031Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eInstead of submitting as “\\u003cem\\u003epinnaple-green-swordwish\\u003c/em\\u003e” many “normal” users want to have notifications in form “\\u003cem\\u003eTim\\u003c/em\\u003e submitted his proposal” (for those who has been granted notion about account connection to the sender identity) but keep the submission private.\\u003c/p\\u003e\\n\\u003cp\\u003eEspecially in case of on-chain governance this allows better level of UX and reducing \\u003ca href=\\\&quot;https://en.wikipedia.org/wiki/Halo_effect\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ehalo\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eThis  requires reveal only commit and have 3rd party to host pool of proposals that later is batch revealed, ongoing UX goals for \\u003ca href=\\\&quot;https://rankify.it\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eRankify.it\\u003c/a\\u003e / \\u003ca href=\\\&quot;https://peeramid.network\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ePeeramid.network\\u003c/a\\u003e  looks like this:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003eBot: @Bob sent a proposal. // public commitment \\u0026amp; signed by Bob and trusted server holding nullifier\\nBot: @Alice sent a proposal. \\nBot: @Georg hurry up!\\nBot: @Georg sent a proposal.\\nBot: New proposals: A;B;C; // Server reveals \\u0026amp; nullifies pool of proposals \\n// Voting phase begins \\u0026lt;..\\u0026gt;\\n// Tally, posts proofs of data integrity\\nBot: Winning proposal was C, it was sent by @Bob\\n\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eCurrent plans is to have marketplace for such private pools, enabling users to pick whatever trust guarantees they want (chose between Lit, ICP, TEE, Self hosted MPC etc).\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/vbuterin\\\&quot;\\u003e@vbuterin\\u003c/a\\u003e Im having hard time to classify that though, does that fit in your categorization under privacy pools  or aggregation?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:22,\&quot;post_type\&quot;: ut specific EIPs (improvement propsals), and general proposals which may become EIPs. If applicable, specify the EIP issue # in the topic title.\&quot;,\&quot;description_excerpt\&quot;:\&quot;Discussions about specific EIPs (improvement propsals), and general proposals which may become EIPs. If applicable, specify the EIP issue # in the topic title.\&quot;,\&quot;topic_url\&quot;:\&quot;/t/about-the-eips-category/12\&quot;,\&quot;read_restricted\&quot;:false,\&quot;permission\&quot;:null,\&quot;notification_level\&quot;:1,\&quot;topic_template\&quot;:\&quot;It is recommended to use the following template when creating a `discussion-to` thread for your EIP on ethereum-magicians.org. Each section has instructions set within a blockquote. Please read the instructions carefully before posting the topic. \\n\\n**Delete the blockquoted instructions below and everything above the following emdash line before posting your topic.**\\n \\n--\\n\\nDiscussion topic for EIP-XXXX \\u003clink to EIP\\u003e\\n\\n#### Update Log \\n\\n\\u003e This section should list significant updates to the EIP as the specification evolves. The first entry should be the PR to create the EIP. The recommended format for log entries is:\\n\\u003e * yyyy-mm-dd: Single sentence description, commit [link to commit]()\\n\\u003e \\n\\u003e For example, using EIP-1: \\n\\u003e * 2024-06-05: Enable external links to Chain Agnostic Improvement Proposals (CAIPs), commit [32dc740](https://github.com/ethereum/EIPs/commit/32dc74013133b579a76f27ea50a219852ed0fa71).\\n\\u003e ...\\n\\u003e\\n\\u003e Fill in the log for the EIP&#39;s initial draft below:\\n\\n* yyyy-mm-dd: initial draft \\u003clink to pull request\\u003e\\n\\n#### External Reviews\\n\\n\\u003e This section should list notable reviews the EIP has received from the Ethereum community. These can include specific comments on this forum, timestamped audio/video exchanges, formal audits, or other external resources. This section should be the go-to for readers to understand the community&#39;s current assessment of the EIP. Aim for neutrality, quality \\u0026 thoroughness over \\\&quot;cherry-picking\\\&quot; the most favorable reviews. \\n\\u003e \\n\\u003e The recommended format for entries is: \\n\\u003e \\n\\u003e * yyyy-mm-dd: Single sentence description, [link to review]()\\n\\u003e \\n\\u003e For example, using EIP-1559, one entry could be:\\n\\u003e * 2020-12-01: \\\&quot;An Economic Analysis of EIP-1559\\\&quot;, by Tim Roughgarden, [full report](https://timroughgarden.org/papers/eip1559.pdf)\\n\\nNone as of yyyy-mm-dd.\\n\\n#### Outstanding Issues \\n\\n\\u003e This section should highlight outstanding issues about the EIP, and, if possible, link to forums where these are being addressed. This section should allow readers to quickly understand what the most important TODOs for the EIP are, and how to best contribute. Once issues are resolved, they should be checked off with a note giving context on the resolution. \\n\\u003e \\n\\u003e The recommended format for new entries is: \\n\\u003e * [ ] yyyy-mm-dd: Issue description, [link to issue]()\\n\\u003e\\n\\u003e Once issues are addressed, these becomes: \\n\\u003e * [x] yyyy-mm-dd: Issue description, [link to issue]()\\n\\u003e     * yyyy-mm-dd: Resolution description, [link to resolution]()\\n\\u003e \\n\\u003e For example, using EIP-3675, one entry could be: \\n\\u003e * [x] 2021-07-08: Repurpose the `DIFFICULTY` opcode, [tracking issue](https://github.com/ethereum/pm/commit/496b4dc9bcb76e5290f5cc5d52d7424ae75a4f96)\\n\\u003e     * 2021-10-30: Introduce EIP-4399, [EIP PR](https://github.com/ethereum/EIPs/pull/4399)\\n\\u003e\\n\\u003e If there are any known outstanding issues currently, fill them out now.\\n\\nNone as of yyyy-mm-dd.\&quot;,\&quot;has_children\&quot;:true,\&quot;subcategory_count\&quot;:null,\&quot;sort_order\&quot;:null,\&quot;sort_ascending\&quot;:null,\&quot;show_subcategory_list\&quot;:true,\&quot;num_featured_topics\&quot;:5,\&quo             <div class='post' itemprop='text'>
              <p><em>See also: pcaversaccio’s roadmap: <a href="https://ethresear.ch/t/ethereum-privacy-the-road-to-self-sovereignty/22115" class="inline-onebox">Ethereum Privacy: The Road to Self-Sovereignty - Privacy - Ethereum Research</a></em></p>
<p>These are my current thoughts on how we can practically improve the state of privacy experienced by Ethereum’s users in a way that is very light on Ethereum consensus changes. This covers four primary key forms of privacy:</p>
<ol>
<li>Privacy of onchain payments</li>
<li>Partial anonymization of onchain activity inside applications</li>
<li>Privacy of reads to the chain, ie. RPC calls</li>
<li>Network-level anonymization</li>
</ol>
<p>This roadmap can be combined with a longer-term roadmap that makes deeper changes to L1, or privacy-preserving application-specific rollups, or other more complex features.</p>
<h2><a name="p-57010-roadmap-1" class="anchor" href="#p-57010-roadmap-1" aria-label="Heading link"></a>Roadmap</h2>
<ol>
<li><strong>Incorporate privacy tools (eg. <a href="https://www.railway.xyz/">Railgun</a>, <a href="https://privacypools.com/">Privacy Pools</a>) into existing wallets</strong>. Wallets should have a notion of a shielded balance, and when you send to someone else, there should be a “send from shielded balance” option, ideally turned on by default. This should all be designed to feel maximally natural from a UX perspective. Users should NOT have to download a separate “privacy wallet”</li>
<li><strong>Move the ecosystem toward “one address per application” by default</strong>. This is a major step, and it entails significant convenience sacrifices, but IMO this is a bullet that we should bite, because this is the most practical way to remove public links between all of your activity across different applications. Moving toward such a design also works very naturally with in-application wallets, and the new workflows required to make this work look very similar to what is needed already with cross-chain interoperability (eg. depositing funds to a chain from one of multiple sources)</li>
<li><strong>Make send-to-self privacy-preserving by default</strong> - needed to make (2) work</li>
<li><strong>Implement <a href="https://ethresear.ch/t/fork-choice-enforced-inclusion-lists-focil-a-simple-committee-based-inclusion-list-proposal/19870">FOCIL</a> and <a href="https://eips.ethereum.org/EIPS/eip-7701">EIP-7701</a></strong>, and make sure to implement a version of FOCIL that is EIP-7701-friendly. Along with EIP 7701’s account abstraction benefits, this allows protocols like PP, Railway, Tornado etc to operate without needing relays / public broadcasters, greatly simplifying the development and maintenance of such protocols. FOCIL greatly improves censorship resistance of all transactions, including privacy-preserving transactions.</li>
<li><strong>Incorporate TEE-based RPC privacy into existing wallets, as a short-term mitigation</strong>. <a href="https://www.1rpc.io/ecosystem/automata">Automata</a> has a version of this already; this needs to be verified and hardened as much as possible. This allows users to interact with RPC nodes while getting stronger assurances that their private data is not being collected.</li>
<li><strong>Replace TEEs with private information retrieval (PIR) once the tech becomes ready</strong>. PIR offers cryptographic guarantees, and so is much stronger than TEEs, but it is currently not efficient enough for large datasets. Potentially we can consider hybrid approaches, eg. use TEEs to isolate regions of the state of size 2**20, and use PIR inside of those, shifting the constants up over time as PIR becomes more efficient.</li>
<li><strong>Wallets should connect to multiple RPC nodes, optionally through a mixnet, ideally use a different RPC node per dapp</strong>. If we also add security armoring to RPC nodes (ie. light client support), it becomes practical for a user to trust a much larger set of RPC servers. This reduces metadata leakage.</li>
<li><strong>Work on proof aggregation protocols</strong> to allow multiple privacy-protocol transactions to share a single onchain proof. This greatly reduces the gas costs of privacy protocols.</li>
<li><strong>Work on privacy-preserving keystore wallets</strong> (see more detailed explanations <a href="https://vitalik.eth.limo/general/2023/06/09/three_transitions.html">in this post</a>). This allows users to upgrade their account verification logic (algorithm or keys) in one transaction, and have this change be immediately reflected in all private notes that they control (across L1 and all L2s!), without publicly linking those notes.</li>
</ol>
<p>At the end of this, we will have a world where:</p>
<ul>
<li>A large portion of sends are private, and private sends are default in many cases</li>
<li>Activity inside of each individual application is public, but the link between your activity in application A and your activity in application B is private</li>
<li>Privacy guarantees hold not just against adversaries passively observing the chain, but also adversaries operating RPC nodes</li>
</ul>

<blockquote>
<p><strong>Move the ecosystem toward “one address per application” by default</strong>. This is a major step, and it entails significant convenience sacrifices, but IMO this is a bullet that we should bite, because this is the most practical way to remove public links between all of your activity across different applications. Moving toward such a design also works very naturally with in-application wallets, and the new workflows required to make this work look very similar to what is needed already with cross-chain interoperability (eg. depositing funds to a chain from one of multiple sources)</p>
</blockquote>
</aside>
<p>What does this mean for ENS usage? My understanding is that most users currently have one intentionally publicly known address that they use to onboard to apps. And then they have other wallets where they store their wealth, trade, etc. Is an „application“ here: wealth store, trading, public theatre, or is an application: Uniswap, Aave?</p>

              <blockquote>
<ol>
<li>You can have a single address that is your ENS address, but that’s not the address you use for apps by default.</li>
</ol>
</blockquote>
<p>Okay, so if we follow this path, I think we have to think about UX. E.g., we could ask users before connecting to each app if they want to make their actions public.</p>
<p>And also educate them that if they make their actions public, they can build their onchain reputation. So it’s like “sending a DM on Signal” vs. “sending a tweet". One is better for privacy, one is better for building reputation.</p>
<p>If we don’t do it, we will slow down onchain identity by a lot. And this is a thing that differentiates blockchain addresses from e-mails.</p>
<p>If you run web2 social (like Reddit), users send their gmail addresses to create an account. As a company you have to accept all of them because you cannot check if one address is more legit than the other. It makes it pretty easy to astroturf and run bot networks.</p>
<p>If you run onchain social, you can take users’ wallets and check some predefined parameters. E.g., how old is the address, how many txs it did, what are relationship with other potentially problematic addresses and so on. We already been doing that at Kiwi and it’s been very helpful to track these behaviors.</p>
<p>On Farcaster, where every action is public by default (and wouldn’t be impacted since they use their own P2P network), you can even create these forensics graphs <a href="https://warpcast.com/geoffgolberg/0xee3cbbea" rel="noopener nofollow ugc">like this one.</a> And of course everyone can do them, which is a big plus.</p>
<p>If - on the other hand - everyone was doing 100% private onchain actions, it’d cripple onchain social defensive capabilities.</p>
<p>PS: We already see onchain identity fragmentation because of in-app wallets, as <a href="https://x.com/MacBudkowski/status/1863951819296153623" rel="noopener nofollow ugc">I described here</a> and lately also noted by <a href="https://warpcast.com/nonlinear.eth/0x7763a1e8" rel="noopener nofollow ugc">nonlinear</a>.</p>
            </div>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-04-11T12:37:02Z' class='post-time'>

            <div class='post' itemprop='text'>
              <p>I’m helping design the Aztec privacy rollup, so this is right up my street. We want to make sure we keep pace with Ethereum’s privacy needs. I have some questions / comments.</p>
<ol>
<li>
<aside class="quote no-group" data-username="vbuterin" data-post="1" data-topic="23459">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png" class="avatar"> vbuterin:</div>
<blockquote>
<p>This allows users to upgrade their account verification logic (algorithm or keys) in one transaction, and have this change be immediately reflected in all private notes that they control (across L1 and all L2s!), without publicly linking those notes</p>
</blockquote>
</aside>
<p>A nullifier keypair for a note can’t easily be rotated, because (a) the nullifier for a given note is deterministically* derived from the secret key of the nullifier public key that “owns” the note, and (b) rotation can lead to double-spend bugs.</p>
<ul>
<li>(a) A nullifier is usually something like <code>hash(hash(note), nullifier_secret_key_1)</code>. If you rotate your nullifier keypair, the nullifier for this note still relies on the old nullifier keypair.</li>
<li>(b) You <em>could</em> detach the “owner” of the note from the nullifier keypair, by storing the nullifier public key against the “owner” in a keystore registry. The owner could then rotate their nullifier public key  in the registry. But there’s then a risk that the “owner” can spend the note twice: once by deriving a nullifier from the first nullifier secret key; and a second time by rotating their nullifier public key and deriving second nullifier from the second nullifier secret key.<br>
* There’s a way to solve this, but it’s constraint-heavy, and requires proving: when the rotation took place; when the note was created; and that the ‘old’ nullifier hasn’t already been used.</li>
</ul>
</li>
<li>
<aside class="quote no-group" data-username="vbuterin" data-post="1" data-topic="23459">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png" class="avatar"> vbuterin:</div>
<blockquote>
<p>Move the ecosystem toward “one address per application” by default</p>
</blockquote>
</aside>
<p>Aren’t there examples of complex defi flows (which compose many smart contract function calls together) which would <em>require</em> the user’s address to be <em>the same</em> across all the different smart contracts?<br>
Even a simple lending contract stores information against a borrower’s address, but also calls separate token contracts to decrement/increment balances of that <em>same borrower’s address</em>.<br>
Consider more crazy complex flows like: take a flash loan; use the borrowed asset to provide liquidity elsewhere; use the LP tokens and stake them somewhere else; use those staked LP tokens as collateral on another protocol to mint a stablecoin; swap the stablecoin for another asset; repay the flash loan.<br>
… For that crazy flow, isn’t it beneficial for the user’s address to be the same across all those smart contracts?<br>
Would it be more fitting to encourage one address per “defi session” (whatever that might be)?<br>
We’re debating this topic at Aztec, currently.</p>
</li>
<li>
<aside class="quote no-group" data-username="vbuterin" data-post="1" data-topic="23459">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png" class="avatar"> vbuterin:</div>
<blockquote>
<p>Users should NOT have to download a separate “privacy wallet”</p>
</blockquote>
</aside>
<p>Would it be acceptable if these wallets have to generate and track a new set of secrets, as most privacy tools use snark-friendly secrets that are different from a user’s Ethereum private key?</p>
</li>
<li>
<aside class="quote no-group" data-username="vbuterin" data-post="1" data-topic="23459">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://ethereum-magicians.org/user_avatar/ethereum-magicians.org/vbuterin/48/1209_2.png" class="avatar"> vbuterin:</div>
<blockquote>
<p>this allows protocols like PP, Railway, Tornado etc to operate without needing relays / public broadcasters</p>
</blockquote>
</aside>
<p>How does this work? How do the gas fees get paid?</p>
</li>
</ol>

            <div class='crawler-post-meta'>
