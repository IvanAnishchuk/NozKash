documents:
  # === Cryptographic Foundations ===

  - id: boneh-lynn-shacham-2001
    title: "Short Signatures from the Weil Pairing"
    authors: [Boneh, Lynn, Shacham]
    year: 2001
    venue: "Asiacrypt 2001 / Journal of Cryptology 2004"
    local_file: boneh-lynn-shacham-2001-short-signatures-weil-pairing.pdf
    doi: "10.1007/S00145-004-0314-9"
    dblp: https://dblp.org/rec/journals/joc/BonehLS04
    iacr_eprint: https://eprint.iacr.org/2001/050
    latex_source: false
    abstract: >
      Introduces BLS signatures: short signatures from bilinear pairings where
      a signature is a single group element and verification uses a pairing check
      e(σ, g₂) = e(H(m), pk). Signatures are roughly half the size of DSA/Schnorr.
    relevance: >
      Foundational paper for NozKash. The blind signature scheme is directly derived
      from BLS: the mint's blind signing S' = sk · B is BLS signing on a blinded
      message point. On-chain verification uses the same pairing check via ecPairing
      (EIP-197). Understanding this paper is prerequisite for everything else.
    keywords: [BLS signatures, bilinear pairings, Weil pairing, short signatures,
               gap-DH assumption, random oracle model]
    key_sections:
      - "Section 3: Gap Diffie-Hellman Groups — defines the security assumption underlying NozKash"
      - "Section 4: Short Signatures — the core BLS construction we adapt"
      - "Section 6: Discussion of signature length vs. DSA/Schnorr"

  - id: boneh-franklin-2001
    title: "Identity-Based Encryption from the Weil Pairing"
    authors: [Boneh, Franklin]
    year: 2001
    venue: "CRYPTO 2001 / SIAM J. Computing 2003"
    local_file: boneh-franklin-2001-ibe-weil-pairing.pdf
    doi: "10.1137/S0097539701398521"
    dblp: https://dblp.org/rec/journals/siamcomp/BonehF03
    iacr_eprint: https://eprint.iacr.org/2001/090
    latex_source: false
    abstract: >
      Constructs the first practical identity-based encryption (IBE) scheme using
      the Weil pairing on elliptic curves. A trusted authority derives private keys
      from identities; anyone can encrypt to an identity string without a certificate.
    relevance: >
      Establishes the bilinear map framework (Type-1/2/3 pairings) that BLS
      signatures and NozKash's verification logic depend on. The hash-to-curve
      construction H: {0,1}* → G₁ used in IBE is the same primitive NozKash uses
      to map spend addresses to curve points for blinding.
    keywords: [identity-based encryption, Weil pairing, bilinear maps, BDH assumption,
               hash-to-curve, random oracle]
    key_sections:
      - "Section 1: Introduction — motivation and bilinear map framework"
      - "Section 3: BasicIdent scheme — the core IBE construction using pairings"
      - "Section 4: Security proof under BDH"

  - id: barreto-naehrig-2005
    title: "Pairing-Friendly Elliptic Curves of Prime Order"
    authors: [Barreto, Naehrig]
    year: 2005
    venue: "Selected Areas in Cryptography 2005"
    local_file: barreto-naehrig-2005-pairing-friendly-curves.pdf
    doi: "10.1007/11693383_22"
    dblp: https://dblp.org/rec/conf/sacrypt/BarretoN05
    iacr_eprint: https://eprint.iacr.org/2005/133
    latex_source: false
    abstract: >
      Presents a method for constructing pairing-friendly elliptic curves of prime
      order with embedding degree 12. These "BN curves" enable efficient optimal
      ate pairings and are the basis for the alt_bn128 (BN254) curve used in
      Ethereum precompiles.
    relevance: >
      BN254 (alt_bn128) is the curve NozKash currently uses for on-chain BLS
      verification via EIP-196/197 precompiles. This paper defines the curve
      family. Understanding BN curve construction explains why BN254 has specific
      security properties and why migration to BLS12-381 is planned.
    keywords: [BN curves, pairing-friendly curves, prime order, embedding degree 12,
               optimal ate pairing, BN254]
    key_sections:
      - "Section 3: Construction of BN curves — the parameterization used by alt_bn128"
      - "Section 5: Efficient pairings — optimal ate pairing implementation"

  - id: groth16
    title: "On the Size of Pairing-based Non-interactive Arguments"
    authors: [Groth]
    year: 2016
    venue: "EUROCRYPT 2016"
    local_file: groth16-pairing-based-arguments.pdf
    doi: "10.1007/978-3-662-49896-5_11"
    dblp: https://dblp.org/rec/conf/eurocrypt/Groth16
    iacr_eprint: https://eprint.iacr.org/2016/260
    latex_source: false
    abstract: >
      Presents the most compact SNARK construction: proofs consist of just 3 group
      elements with verification requiring 3 pairings. Achieves optimal proof size
      for pairing-based non-interactive arguments of knowledge.
    relevance: >
      Groth16 is the proof system used by Tornado Cash and Zcash (via Sapling).
      NozKash deliberately avoids ZK-SNARKs in favor of BLS blind signatures, but
      Groth16 is the key comparison point — it uses the same BN254 curve and
      ecPairing precompile. Understanding Groth16 gas costs helps justify NozKash's
      design choice of ~120k gas vs. Tornado Cash's ~300k gas for verification.
    keywords: [zk-SNARKs, non-interactive proofs, pairing-based, Groth16, QAP,
               trusted setup, succinct verification]
    key_sections:
      - "Section 1: Introduction — proof size lower bounds"
      - "Section 3: The SNARK construction — 3-element proofs"
      - "Section 4: Verification algorithm — 3 pairing checks"

  - id: poseidon-2019
    title: "Poseidon: A New Hash Function for Zero-Knowledge Proof Systems"
    authors: [Grassi, Khovratovich, Rechberger, Roy, Schofnegger]
    year: 2019
    venue: "USENIX Security Symposium 2021"
    local_file: poseidon-hash-2019.pdf
    dblp: https://dblp.org/rec/conf/uss/0001KR0S21
    iacr_eprint: https://eprint.iacr.org/2019/458
    latex_source: false
    abstract: >
      Designs a hash function optimized for zero-knowledge proof systems, operating
      natively over prime fields. Uses a sponge construction with partial S-box
      layers to minimize the number of multiplications in arithmetic circuits.
    relevance: >
      Poseidon is the hash used in Tornado Cash's Merkle tree for commitment
      inclusion proofs. NozKash avoids Poseidon because it avoids ZK circuits
      entirely — using keccak256 hash-to-curve instead. Understanding Poseidon
      helps explain the complexity tradeoff NozKash sidesteps.
    keywords: [algebraic hash, sponge construction, SNARK-friendly, Merkle tree,
               prime field arithmetic, Tornado Cash]
    key_sections:
      - "Section 3: Design — sponge construction with partial rounds"
      - "Section 5: Applications — Merkle tree commitments for mixers"

  - id: coron-2000
    title: "On the Exact Security of Full Domain Hash"
    authors: [Coron]
    year: 2000
    venue: "CRYPTO 2000"
    local_file: coron-2000-full-domain-hash.pdf
    doi: "10.1007/3-540-44598-6_14"
    dblp: https://dblp.org/rec/conf/crypto/Coron00
    iacr_eprint: https://eprint.iacr.org/2000/016
    latex_source: false
    abstract: >
      Provides a tight security reduction for Full Domain Hash (FDH) signatures
      in the random oracle model, improving Bellare and Rogaway's original analysis.
      Shows the security loss is at most a factor of q_s (number of sign queries).
    relevance: >
      FDH is the paradigm behind hash-to-curve-then-sign, which is exactly how
      NozKash works: H(spend_addr) is hashed to G₁, then the mint signs with BLS.
      This paper's security analysis applies directly to our construction's
      unforgeability guarantees.
    keywords: [full domain hash, tight security reduction, random oracle model,
               hash-and-sign, unforgeability]
    key_sections:
      - "Section 2: Improved security reduction for FDH"
      - "Section 3: Optimality of the reduction"

  # === BLS Signatures & Pairings ===

  - id: boldyreva-2003
    title: "Threshold Signatures, Multisignatures and Blind Signatures Based on Gap-DH"
    authors: [Boldyreva]
    year: 2003
    venue: "Public Key Cryptography 2003"
    local_file: boldyreva-2003-threshold-blind-signatures-gap-dh.pdf
    doi: "10.1007/3-540-36288-6_3"
    dblp: https://dblp.org/rec/conf/pkc/Boldyreva03
    iacr_eprint: https://eprint.iacr.org/2002/118
    latex_source: false
    abstract: >
      Constructs threshold, multisignature, and blind signature schemes from the
      Gap Diffie-Hellman (GDH) assumption in bilinear groups. The blind signature
      scheme is: user sends B = r·H(m), signer returns S' = sk·B, user unblinds
      S = r⁻¹·S' to obtain a valid BLS signature.
    relevance: >
      This is THE paper for NozKash's core protocol. Our blind signing flow
      (blind → sign → unblind) is exactly Boldyreva's BLS blind signature
      construction. Section 4.3 is our protocol specification. The threshold
      scheme in Section 4.1 is the basis for future mint decentralization.
    keywords: [blind signatures, BLS, threshold signatures, gap-DH, bilinear groups,
               unblinding, multisignatures]
    key_sections:
      - "Section 4.3: Blind Signatures — the exact construction NozKash implements"
      - "Section 4.1: Threshold Signatures — basis for decentralized mint"
      - "Section 3: Security definitions — blindness and unforgeability"

  - id: boneh-gentry-lynn-shacham-2003
    title: "Aggregate and Verifiably Encrypted Signatures from Bilinear Maps"
    authors: [Boneh, Gentry, Lynn, Shacham]
    year: 2003
    venue: "EUROCRYPT 2003"
    local_file: boneh-gentry-lynn-shacham-2003-aggregate-signatures.pdf
    doi: "10.1007/3-540-39200-9_26"
    dblp: https://dblp.org/rec/conf/eurocrypt/BonehGLS03
    iacr_eprint: https://eprint.iacr.org/2002/175
    latex_source: false
    abstract: >
      Introduces aggregate signatures where n BLS signatures on n distinct messages
      by n distinct signers can be compressed into a single group element. Also
      constructs verifiably encrypted signatures using bilinear maps.
    relevance: >
      Aggregate BLS verification is the key to batch redemption in NozKash. If
      multiple tokens are redeemed in one transaction, their signatures can be
      aggregated and verified with a single pairing check, dramatically reducing
      gas costs. Also relevant for the BLS12-381 migration with EIP-2537.
    keywords: [aggregate signatures, BLS, batch verification, verifiably encrypted,
               bilinear maps, signature compression]
    key_sections:
      - "Section 3: Aggregate Signatures — the BGLS aggregation scheme"
      - "Section 4: Verification — single pairing check for n signatures"
      - "Section 6: Verifiably Encrypted Signatures"

  - id: quan-2021
    title: "Attacks and Weaknesses of BLS Aggregate Signatures"
    authors: [Quan]
    year: 2021
    venue: "IACR Cryptol. ePrint Arch."
    local_file: quan-2021-bls-aggregate-attacks.pdf
    dblp: https://dblp.org/rec/journals/iacr/Quan21a
    iacr_eprint: https://eprint.iacr.org/2021/377
    latex_source: false
    abstract: >
      Surveys known attacks on BLS aggregate signatures including rogue public key
      attacks, message augmentation bypasses, and implementation pitfalls. Shows
      how naive aggregation without proof-of-possession or message augmentation
      allows forging aggregate signatures.
    relevance: >
      Critical security reference. NozKash uses a single mint key (no aggregation
      of signer keys), avoiding rogue-key attacks. But when implementing batch
      redemption with signature aggregation, the message augmentation and
      proof-of-possession mitigations described here become essential.
    keywords: [rogue key attack, BLS aggregation, proof of possession,
               message augmentation, implementation pitfalls]
    key_sections:
      - "Section 2: Rogue Public Key Attack — the primary threat"
      - "Section 3: Mitigations — proof-of-possession and message augmentation"
      - "Section 4: Implementation considerations"

  - id: eaton-2023
    title: "Security Analysis of Signature Schemes with Key Blinding"
    authors: [Eaton, Lepoint, Wood]
    year: 2023
    venue: "IACR Cryptol. ePrint Arch."
    local_file: eaton-2023-key-blinding-security.pdf
    dblp: https://dblp.org/rec/journals/iacr/EatonLW23
    iacr_eprint: https://eprint.iacr.org/2023/1577
    latex_source: false
    abstract: >
      Formalizes the security of key blinding — deriving multiple unlinkable public
      keys from a single master key — for Ed25519, ECDSA, and Schnorr signatures.
      Proves that blinded keys maintain unforgeability under standard assumptions.
    relevance: >
      Key blinding is related to NozKash's deposit ID derivation: each token
      derives a unique deposit_id from master_seed, creating unlinkable deposits.
      This paper's security analysis confirms that deriving keys from a master
      doesn't weaken the signature scheme — relevant to our seed-based design.
    keywords: [key blinding, unlinkable keys, Ed25519, ECDSA, key derivation,
               unforgeability, Privacy Pass]
    key_sections:
      - "Section 3: Formal security model for key blinding"
      - "Section 4: Proofs for Ed25519 and ECDSA"
      - "Section 5: Application to Privacy Pass"

  # === Curves & Hash-to-Curve ===

  - id: kim-barbulescu-2016
    title: "Extended Tower Number Field Sieve"
    authors: [Kim, Barbulescu]
    year: 2016
    venue: "Public Key Cryptography 2017"
    local_file: kim-barbulescu-2016-extnfs.pdf
    doi: "10.1007/978-3-662-54365-8_16"
    dblp: https://dblp.org/rec/conf/pkc/0001J17
    iacr_eprint: https://eprint.iacr.org/2017/334
    latex_source: false
    abstract: >
      Introduces the Extended Tower NFS (exTNFS) attack on the discrete logarithm
      problem in extension fields, reducing the security of BN254 from the
      previously estimated ~128 bits to approximately 100 bits.
    relevance: >
      This is the paper that broke BN254's 128-bit security claim and is the
      primary motivation for NozKash's migration from BN254 to BLS12-381. The
      ~100-bit security level is still sufficient for many applications but
      falls below the 128-bit target for long-term cryptographic security.
    keywords: [exTNFS, number field sieve, BN254, discrete logarithm,
               security downgrade, pairing security]
    key_sections:
      - "Section 3: The exTNFS algorithm"
      - "Section 5: Impact on BN curves — the 100-bit security estimate"

  - id: barbulescu-duquesne-2018
    title: "Updating Key Size Estimations for Pairings"
    authors: [Barbulescu, Duquesne]
    year: 2018
    venue: "Journal of Cryptology 2019"
    local_file: barbulescu-duquesne-2018-key-size-pairings.pdf
    doi: "10.1007/S00145-018-9280-5"
    dblp: https://dblp.org/rec/journals/joc/BarbulescuD19
    latex_source: false
    abstract: >
      Comprehensive reassessment of pairing-based key sizes after the TNFS and
      exTNFS attacks. Provides updated security estimates for BN, BLS12, and
      other pairing-friendly curve families. Confirms BLS12-381 at ~117-120 bits.
    relevance: >
      Authoritative reference for BN254 vs BLS12-381 security comparison.
      Confirms the security gap driving NozKash's curve migration. Table 1
      provides the definitive security level estimates used in our design docs.
    keywords: [key size estimation, TNFS, BN curves, BLS12, security level,
               pairing security, curve selection]
    key_sections:
      - "Table 1: Updated security levels for all pairing-friendly curve families"
      - "Section 5: Recommendations — BLS12-381 as the new standard"

  - id: fouque-tibouchi-2012
    title: "Indifferentiable Hashing to Barreto-Naehrig Curves"
    authors: [Fouque, Tibouchi]
    year: 2012
    venue: "LATINCRYPT 2012"
    local_file: null  # REMOVED: file contained wrong paper; see FETCH_FAILURES.md
    doi: "10.1007/978-3-642-33481-8_1"
    dblp: https://dblp.org/rec/conf/latincrypt/FouqueT12
    latex_source: false
    abstract: >
      Constructs an indifferentiable hash function mapping arbitrary strings to
      points on BN curves, using the Shallue-van de Woestijne (SW) encoding.
      Proves indifferentiability from a random oracle in the standard model.
    relevance: >
      Provides the theoretical foundation for NozKash's hash-to-curve on BN254.
      Our try-and-increment hash (keccak256 with counter) is a simpler approach
      that sacrifices constant-time for EVM compatibility, but this paper's SW
      map is the formal standard referenced by RFC 9380.
    keywords: [hash-to-curve, BN curves, indifferentiability, Shallue-van de Woestijne,
               random oracle, constant-time]
    key_sections:
      - "Section 3: SW encoding to BN curves"
      - "Section 4: Indifferentiability proof"

  - id: wahby-boneh-2019
    title: "Fast and Simple Constant-Time Hashing to BLS12-381"
    authors: [Wahby, Boneh]
    year: 2019
    venue: "IACR Trans. Cryptogr. Hardw. Embed. Syst. 2019"
    local_file: wahby-boneh-2019-hash-to-bls12-381.pdf
    doi: "10.13154/TCHES.V2019.I4.154-179"
    dblp: https://dblp.org/rec/journals/tches/WahbyB19
    iacr_eprint: https://eprint.iacr.org/2019/099
    latex_source: false
    abstract: >
      Presents optimized, constant-time hash-to-curve algorithms for BLS12-381
      using the simplified SWU map. Achieves 2-3x speedup over previous methods
      while maintaining indifferentiability.
    relevance: >
      Directly relevant to NozKash's BLS12-381 migration. The simplified SWU
      map described here is what RFC 9380 standardizes for BLS12-381 hash-to-G1
      and hash-to-G2. Our Python implementation uses py_ecc's hash_to_G1 which
      implements this paper's algorithm.
    keywords: [hash-to-curve, BLS12-381, simplified SWU, constant-time,
               indifferentiable, isogeny map]
    key_sections:
      - "Section 3: Simplified SWU map — the core algorithm"
      - "Section 4: Isogeny-based optimization for BLS12-381"
      - "Section 5: Performance benchmarks"

  # === Blind Signatures & eCash ===

  - id: chaum-fiat-naor-1988
    title: "Untraceable Electronic Cash"
    authors: [Chaum, Fiat, Naor]
    year: 1988
    venue: "CRYPTO 1988"
    local_file: chaum-fiat-naor-1988-untraceable-ecash.pdf
    doi: "10.1007/0-387-34799-2_25"
    dblp: https://dblp.org/rec/conf/crypto/ChaumFN88
    latex_source: false
    notes: Predates arXiv (1991) and IACR ePrint
    abstract: >
      Introduces the concept of untraceable electronic cash using blind signatures.
      A bank signs a blinded coin, the user unblinds it, and later redeems it —
      the bank cannot link the signing to the redemption. Includes double-spend
      detection via identity revelation.
    relevance: >
      The foundational eCash paper. NozKash implements the same conceptual flow
      (blind → sign → unblind → redeem) but replaces RSA blind signatures with
      BLS blind signatures and moves the mint to a smart contract. The double-spend
      prevention via nullifiers in NozKash is a blockchain-native version of
      Chaum's cut-and-choose approach.
    keywords: [electronic cash, blind signatures, unlinkability, double-spend detection,
               anonymity, RSA blind signatures, bank protocols]
    key_sections:
      - "Section 2: Basic off-line eCash — the blind signature flow"
      - "Section 3: Double-spend detection via identity embedding"
      - "Section 4: Multi-denomination extensions"

  - id: chaum-2022
    title: "eCash 2.0"
    authors: [Chaum, Moser]
    year: 2022
    venue: whitepaper
    local_file: chaum-2022-ecash-2.0.pdf
    latex_source: false
    notes: Industry whitepaper by xx network / David Chaum
    abstract: >
      Proposes a modern eCash system with quantum-resistant blind signatures,
      offline capability, and regulatory compliance hooks. Extends Chaum's
      original 1988 construction with post-quantum primitives and revocable
      anonymity for law enforcement cooperation.
    relevance: >
      Comparison point for NozKash's design philosophy. eCash 2.0 adds compliance
      features (revocable anonymity) that NozKash avoids in favor of Privacy Pools
      (association sets). Also informs the BIS Project Tourbillon prototype.
    keywords: [eCash, post-quantum, offline payments, revocable anonymity,
               CBDC, blind signatures, David Chaum]
    key_sections:
      - "Section 2: Updated blind signature construction"
      - "Section 4: Compliance architecture — revocable anonymity"
      - "Section 5: Comparison with CBDC approaches"

  - id: davidson-2018
    title: "Privacy Pass: Bypassing Internet Challenges Anonymously"
    authors: [Davidson, Goldberg, Sullivan, Tankersley, Valsorda]
    year: 2018
    venue: "Proc. Privacy Enhancing Technologies 2018"
    local_file: davidson-2018-privacy-pass.pdf
    doi: "10.1515/POPETS-2018-0026"
    dblp: https://dblp.org/rec/journals/popets/DavidsonGSTV18
    latex_source: false
    abstract: >
      Presents Privacy Pass, a protocol where users solve one CAPTCHA to obtain
      multiple anonymous tokens via a VOPRF (verifiable oblivious PRF). Tokens
      are unlinkable to the issuance interaction, enabling anonymous bypass of
      future challenges. Deployed in Cloudflare's infrastructure.
    relevance: >
      Privacy Pass is the closest deployed analogue to NozKash's architecture.
      Both use blind token issuance with unlinkable redemption. NozKash differs
      by using BLS blind signatures instead of VOPRFs and by settling value on
      a blockchain rather than bypassing CAPTCHAs. The IETF RFCs (9474-9578)
      in our collection standardize this protocol.
    keywords: [Privacy Pass, VOPRF, anonymous tokens, Cloudflare, blind issuance,
               unlinkable redemption, CAPTCHA bypass]
    key_sections:
      - "Section 3: Protocol — blind token issuance via VOPRF"
      - "Section 4: Security — unlinkability and unforgeability"
      - "Section 6: Deployment — Cloudflare production deployment"

  - id: wahby-boneh-2020
    title: "An Airdrop that Preserves Recipient Privacy"
    authors: [Wahby, Boneh, Jeffrey, Poon]
    year: 2020
    venue: "Financial Cryptography 2020"
    local_file: wahby-boneh-2020-private-airdrop.pdf
    doi: "10.1007/978-3-030-51280-4_24"
    dblp: https://dblp.org/rec/conf/fc/WahbyBJP20
    iacr_eprint: https://eprint.iacr.org/2020/729
    latex_source: false
    abstract: >
      Designs a system for distributing tokens to a set of eligible recipients
      without revealing which recipients claimed their tokens. Uses Merkle tree
      membership proofs combined with nullifiers to prevent double-claiming
      while maintaining unlinkability.
    relevance: >
      Directly relevant architectural comparison. Like NozKash, uses nullifiers
      to prevent double-spend and hash-to-curve for commitment binding. The key
      difference is NozKash uses blind signatures instead of Merkle inclusion
      proofs, avoiding the need for a trusted setup phase to populate the tree.
    keywords: [private airdrop, nullifiers, Merkle proofs, unlinkability,
               token distribution, double-spend prevention]
    key_sections:
      - "Section 3: Protocol design — nullifiers and Merkle proofs"
      - "Section 4: Smart contract verification"
      - "Section 5: Comparison with blind signature approaches"

  # === Privacy Protocols & Compliance ===

  - id: zerocash-2014
    title: "Zerocash: Decentralized Anonymous Payments from Bitcoin"
    authors: [Ben-Sasson, Chiesa, Garman, Green, Miers, Tromer, Virza]
    year: 2014
    venue: "IEEE Symposium on Security and Privacy 2014"
    local_file: zerocash-2014.pdf
    doi: "10.1109/SP.2014.36"
    dblp: https://dblp.org/rec/conf/sp/Ben-SassonCG0MTV14
    iacr_eprint: https://eprint.iacr.org/2014/349
    latex_source: false
    abstract: >
      Constructs a decentralized anonymous payment system using zk-SNARKs.
      Transactions hide sender, recipient, and amount using shielded notes
      with nullifiers. Deployed as Zcash.
    relevance: >
      The gold standard for blockchain privacy, and the main comparison point
      for NozKash's "no ZK proofs" design philosophy. Zerocash achieves stronger
      privacy (hidden amounts, hidden graph) but with much higher complexity:
      trusted setup, complex circuits, higher gas costs. NozKash trades some
      privacy (fixed denomination, visible deposit/redeem timing) for simplicity.
    keywords: [zk-SNARKs, anonymous payments, nullifiers, shielded transactions,
               Zcash, trusted setup, commitment scheme]
    key_sections:
      - "Section 3: Zerocash DAP scheme — pour transactions"
      - "Section 4: zk-SNARK circuit construction"
      - "Section 6: Performance — proof generation and verification costs"

  - id: tornado-cash-2019
    title: "Tornado Cash Privacy Solution"
    authors: [Pertsev, Semenov, Storm]
    year: 2019
    venue: whitepaper
    local_file: tornado-cash-whitepaper-2019.pdf
    latex_source: false
    notes: Whitepaper; original hosting taken down 2022, archived copies exist
    abstract: >
      Describes a non-custodial Ethereum mixer using zk-SNARKs (Groth16) with
      fixed denominations. Users deposit ETH with a commitment, then prove
      Merkle tree membership via a zero-knowledge proof to withdraw to a
      different address, breaking the on-chain link.
    relevance: >
      NozKash's closest on-chain competitor and primary design inspiration.
      Same fixed-denomination approach, same deposit-then-withdraw flow. NozKash
      replaces Groth16 proofs (~300k gas) with BLS blind signatures (~120k gas),
      eliminates the trusted setup, and uses blind signatures instead of Merkle
      trees. OFAC sanctions on Tornado Cash (2022) motivate NozKash's compliance
