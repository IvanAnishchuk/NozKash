[project]
site_name = "NozKash Documentation"
site_description = "Privacy-preserving eCash for EVM chains using BLS blind signatures"
site_author = "NozKash Team"
site_url = "https://nozkash.github.io/docs/"
copyright = "Dedicated to public goods under CC0."
docs_dir = "src"
site_dir = "_site"
repo_url = "https://github.com/IvanAnishchuk/nozkash"
repo_name = "IvanAnishchuk/nozkash"

[project.theme]
language = "en"

[[project.theme.palette]]
scheme = "default"
primary = "deep purple"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "deep purple"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.features]
features = [
    "navigation.instant",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "navigation.indexes",
    "search.highlight",
    "search.suggest",
    "content.code.copy",
    "content.tabs.link",
    "toc.integrate",
]

[project.nav]
nav = [
    { "Home" = "index.md" },
    { "Getting Started" = [
        { "Overview" = "getting-started/index.md" },
        { "Installation" = "getting-started/installation.md" },
