[project]
name = "nozkash"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eth-hash[pycryptodome]>=0.7.1",
    "eth-keys>=0.7.0",
    "eth-utils>=5.3.1",
    "py-ecc>=7.0",
    "pycryptodome>=3.23.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "typer>=0.24.1",
    "web3>=7.14.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "chia-rs>=0.42.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
    "ty>=0.0.7",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["typings"]

[tool.pytest.ini_options]
addopts = "--cov=bls12_381_crypto --cov=nozk_library --cov=mint_mock --cov=redeem_mock --cov=contract_errors --cov=wallet_state --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = [
    "bls12_381_crypto",
    "nozk_library",
    "mint_mock",
    "redeem_mock",
    "contract_errors",
    "wallet_state",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 59
